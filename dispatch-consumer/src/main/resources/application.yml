server:
  port: 8086

spring:
  application:
    name: dispatch-consumer
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cardsdb}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    group-id: dispatch-consumer
    schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  topics:
    main: bank.card.replacements.v1
    dlt: bank.card.replacements.v1.DLT

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    org.apache.kafka: INFO
